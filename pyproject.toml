[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-lob-oracle"
version = "0.1.0"
description = "Offline correctness oracle for Binance BTCUSDT/ETHUSDT market-data contracts"
requires-python = ">=3.14"
dependencies = ["websockets==17.0.1"]

[project.scripts]
binance-lob = "binance_lob.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
