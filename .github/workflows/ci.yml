name: ci

on:
  push:
  pull_request:

jobs:
  rust-python:
    name: Rust + Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure rustfmt and clippy components
        run: |
          rustup component add rustfmt clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust tests (all targets)
        run: cargo test --all-targets

      - name: Rust clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      # cfg-gate for the Windows-only modules: windows_etw / windows_tcp are
      # #[cfg(windows)] in rust/lob-replay/src/lib.rs. Building all targets on
      # Linux exercises their EXCLUSION; on Windows it exercises their
      # INCLUSION. Both legs must compile.
      - name: Windows-only modules cfg-gate (windows_etw / windows_tcp)
        run: cargo check --all-targets

      - name: Python unit tests
        shell: bash
        run: |
          set -e
          # The pinned hash lock (requirements.lock) is specific to the
          # Windows x86-64 wheel; on Linux install the same pinned version
          # from PyPI without the cross-platform hash.
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install -r requirements.lock
          else
            python -m pip install "websockets==17.0.1"
          fi
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests -v

  cpp:
    name: C++ suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (golden vector generators)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: C++ suites (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File cpp\build.ps1 -Phase all

      - name: C++ suites (Linux, g++)
        if: runner.os == 'Linux'
        run: |
          set -e
          bash cpp/build.sh all

      - name: SBE lane tests (mock server + decode CLI)
        shell: bash
        run: |
          set -e
          python -m pip install "websockets==17.0.1"
          export PYTHONPATH="$PWD/cpp/sbe-lane"
          python -m unittest discover -s cpp/sbe-lane/tests -v

  cpp-bench:
    # Latency benchmarks in dev mode (fast, verified pipeline). Final mode
    # (held-out sizes) stays local by design: its numbers are only
    # meaningful on a quiet machine dedicated to the measurement, which a
    # shared CI runner is not. CI therefore proves the suite builds and runs
    # on Linux AND Windows, and publishes the measured dev JSONs (including
    # the HDR percentiles) as artifacts.
    name: C++ benchmarks dev (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (JSON benchmark + HDR cross-check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Benchmarks dev (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File cpp\bench\run_benchmarks.ps1 -Mode dev

      - name: Benchmarks dev (Linux, g++)
        if: runner.os == 'Linux'
        run: |
          set -e
          bash cpp/bench/run_benchmarks.sh dev

      - name: Upload benchmark JSONs (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-jsons-${{ matrix.os }}
          path: |
            cpp/bench/benchmarks/*_dev.json
            cpp/bench/benchmarks/*_dev_hdr.json
          if-no-files-found: error
